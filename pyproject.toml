[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "patchdedup"
version = "0.2.0.dev0"
description = "Conservative redundancy detection for professional bullets in Brazilian Portuguese"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = ["pydantic==2.12.4"]

[tool.uv]
conflicts = [[{ extra = "ml" }, { extra = "cpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[project.scripts]
patchdedup = "patchdedup.cli:main"

[project.optional-dependencies]
ml = [
    "huggingface-hub==0.36.0",
    "numpy==2.3.4",
    "optuna==4.5.0",
    "peft==0.17.1",
    "safetensors==0.6.2",
    "scikit-learn==1.7.2",
    "sentence-transformers==5.1.2",
    "sentencepiece==0.2.1",
    "torch==2.6.0",
    "transformers==4.57.1",
]

cpu = [
    "huggingface-hub==0.36.0",
    "numpy==2.3.4",
    "safetensors==0.6.2",
    "scikit-learn==1.7.2",
    "sentence-transformers==5.1.2",
    "sentencepiece==0.2.1",
    "torch==2.6.0",
    "transformers==4.57.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/patchdedup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: requires a real checkpoint", "ml: requires ML dependencies"]

[tool.ruff]
target-version = "py311"
line-length = 100
