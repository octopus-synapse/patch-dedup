[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "patchdedup"
version = "0.1.0.dev0"
description = "Conservative redundancy detection for professional bullets in Brazilian Portuguese"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = ["pydantic==2.12.4"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[project.scripts]
patchdedup = "patchdedup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchdedup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: requires a real checkpoint (future milestone)"]

[tool.ruff]
target-version = "py311"
line-length = 100
